name: Keep Render backend awake

# Render 무료 플랜은 약 15분간 요청이 없으면 슬립 모드로 들어간다.
# 10분마다 /health를 호출해서 데모 시간대(오늘 하루) 동안 깨어있게 유지한다.
# workflow_dispatch로 필요하면 수동으로도 즉시 실행 가능.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      # 슬립 상태에서 깨어나는 동안 Render가 즉시 5xx를 돌려주는 경우가 있어서
      # (exit code 22로 실패) 에러여도 재시도하고, 콜드스타트(~20초)를 기다릴 수 있게 타임아웃을 둔다.
      - name: Ping backend health endpoint
        timeout-minutes: 8
        run: >-
          curl -sSf
          --max-time 60
          --retry 5
          --retry-delay 15
          --retry-all-errors
          https://newbitton.onrender.com/health
